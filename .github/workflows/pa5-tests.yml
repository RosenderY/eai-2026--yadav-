name: PA5 integration tests

on:
  push:
    paths:
      - 'pa5/**'
      - '.github/workflows/pa5-tests.yml'
  workflow_dispatch:

jobs:
  pa5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install public test dependencies
        run: npm --prefix pa5/tests ci
      - name: Build and start PA5 stack
        working-directory: pa5
        run: docker compose up -d --build --wait
      - name: Run public tests
        run: npm --prefix pa5/tests test
      - name: Show service logs if failed
        if: failure()
        working-directory: pa5
        run: docker compose logs --no-color --tail=150
      - name: Stop stack
        if: always()
        working-directory: pa5
        run: docker compose down -v
